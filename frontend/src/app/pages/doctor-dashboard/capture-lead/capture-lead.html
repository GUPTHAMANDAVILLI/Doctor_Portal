<div class="p-6 max-w-4xl mx-auto space-y-6">

  <!-- Header -->
  <div class="border-b border-slate-200 pb-4">
    <h1 class="text-2xl font-bold text-slate-800">Capture Patient Lead</h1>
    <p class="text-xs text-slate-500 mt-0.5">Register a new patient into the hospital database</p>
  </div>

  <!-- Form Card -->
  <div class="p-6 bg-white rounded-lg border border-slate-200 shadow-sm">

    <!-- Alerts -->
    <div *ngIf="errorMessage" class="mb-4 p-3 rounded bg-red-50 border border-red-200 text-red-700 text-xs font-medium">
      {{ errorMessage }}
    </div>

    <div *ngIf="success" class="mb-4 p-3 rounded bg-green-50 border border-green-200 text-green-700 text-xs font-medium">
      Patient captured successfully! Redirecting...
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 text-xs">

      <!-- Patient Information -->
      <div>
        <h3 class="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2 mb-3">1. Patient Information</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

          <div>
            <label class="block font-semibold text-slate-600 mb-1">First Name *</label>
            <input formControlName="first_name" type="text" placeholder="First Name" class="form-input"
              [class.border-red-500]="isInvalid('first_name')"/>
            <p *ngIf="isInvalid('first_name')" class="text-[11px] text-red-600 mt-1">First name is required.</p>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1">Last Name</label>
            <input formControlName="last_name" type="text" placeholder="Last Name" class="form-input"/>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1">Phone Number *</label>
            <input formControlName="phone" type="text" placeholder="10-digit mobile" class="form-input"
              [class.border-red-500]="isInvalid('phone')"/>
            <p *ngIf="isInvalid('phone')" class="text-[11px] text-red-600 mt-1">Valid 10-digit phone required.</p>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1">Email</label>
            <input formControlName="email" type="email" placeholder="email@example.com" class="form-input"/>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1">Gender</label>
            <select formControlName="gender" class="form-input">
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div>
            <label class="block font-semibold text-slate-600 mb-1">Date of Birth</label>
            <input formControlName="dob" type="date" (change)="onDobChange($event)" class="form-input"/>
          </div>

        </div>
      </div>

      <!-- Treatment & Urgency -->
      <div>
        <h3 class="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2 mb-3">2. Treatment & Urgency</h3>

        <div class="space-y-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Urgency Level</label>
            <div class="flex gap-2">
              <button type="button" *ngFor="let opt of urgencyOptions" (click)="setUrgency(opt.label)"
                class="px-4 py-2 rounded-lg text-xs font-semibold border transition-all cursor-pointer"
                [class.bg-emerald-600]="selectedUrgency === opt.label && opt.label === 'Routine'"
                [class.border-emerald-600]="selectedUrgency === opt.label && opt.label === 'Routine'"
                [class.bg-orange-500]="selectedUrgency === opt.label && opt.label === 'Priority'"
                [class.border-orange-500]="selectedUrgency === opt.label && opt.label === 'Priority'"
                [class.bg-red-600]="selectedUrgency === opt.label && opt.label === 'Urgent'"
                [class.border-red-600]="selectedUrgency === opt.label && opt.label === 'Urgent'"
                [class.text-white]="selectedUrgency === opt.label"
                [class.bg-white]="selectedUrgency !== opt.label"
                [class.text-slate-700]="selectedUrgency !== opt.label"
                [class.border-slate-200]="selectedUrgency !== opt.label">
                <span>{{ opt.label }}</span>
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block font-semibold text-slate-600 mb-1">Treatment Procedure</label>
              <select formControlName="treatment_type" class="form-input">
                <option *ngFor="let t of entTreatments" [value]="t">{{ t }}</option>
              </select>
            </div>

            <div>
              <label class="block font-semibold text-slate-600 mb-1">Estimated Cost (₹) *</label>
              <input formControlName="amount" type="number" placeholder="1500" class="form-input"/>
            </div>
          </div>
        </div>
      </div>

      <!-- Schedule & Notes -->
      <div>
        <h3 class="font-bold text-sm text-slate-800 border-b border-slate-100 pb-2 mb-3">3. Schedule & Clinical Notes</h3>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-3">
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Preferred Appt Date</label>
            <input formControlName="preferred_appointment" type="date" class="form-input"/>
          </div>
          <div>
            <label class="block font-semibold text-slate-600 mb-1">Country</label>
            <input formControlName="country" type="text" class="form-input"/>
          </div>
        </div>

        <div>
          <label class="block font-semibold text-slate-600 mb-1">Clinical Notes</label>
          <textarea formControlName="clinical_notes" rows="3" placeholder="Enter clinical notes..." class="form-input"></textarea>
        </div>
      </div>

      <!-- Controls -->
      <div class="pt-4 border-t border-slate-100 flex items-center justify-end gap-3">
        <button type="button" (click)="form.reset()" class="px-4 py-2 rounded bg-slate-100 text-slate-600 font-medium">
          Reset
        </button>
        <button type="submit" [disabled]="loading"
          class="px-5 py-2 rounded bg-blue-600 hover:bg-blue-700 text-white font-semibold cursor-pointer disabled:opacity-50">
          {{ loading ? 'Saving...' : 'Submit Patient Lead' }}
        </button>
      </div>

    </form>
  </div>

</div>
