<div class="min-h-screen bg-slate-50 flex flex-col justify-between">

  <!-- Header Banner (Blue) -->
  <div class="bg-blue-600 relative pt-8 pb-12 px-6">
    <button (click)="goBack()"
      class="absolute top-4 left-4 w-8 h-8 bg-white/10 hover:bg-white/20 rounded-lg flex items-center justify-center text-white cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
    </button>

    <div class="flex flex-col items-center text-center">
      <div class="w-10 h-10 bg-white/20 rounded-lg flex items-center justify-center mb-2 text-white font-bold text-base">
        UC
      </div>
      <h1 class="text-white text-xl font-bold">Doctor Portal Sign In</h1>
      <p class="text-blue-100 text-xs mt-0.5">Uma Clinic ENT Department</p>
    </div>
  </div>

  <!-- Form Card -->
  <div class="flex-1 flex justify-center -mt-6 px-4">
    <div class="bg-white rounded-lg border border-slate-200 w-full max-w-md p-6 self-start shadow-sm">

      <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
        <div>
          <h2 class="text-base font-bold text-slate-800">Welcome Doctor</h2>
          <p class="text-slate-500 text-xs">Enter your credentials to sign in</p>
        </div>
        <button type="button" (click)="fillDemoCredentials()"
          class="px-2.5 py-1 rounded bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold text-xs border border-blue-200 cursor-pointer">
          Fill Demo Credentials
        </button>
      </div>

      <!-- Error Alert -->
      <div *ngIf="errorMessage" class="mb-4 px-3 py-2 bg-red-50 border border-red-200 text-red-700 rounded text-xs font-medium">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <!-- Email -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">Username / Email</label>
          <input formControlName="email" type="email" placeholder="reddy@gmail.com" class="form-input"/>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1 uppercase">Password</label>
          <div class="relative">
            <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="Enter password" class="form-input pr-14"/>
            <button type="button" (click)="togglePassword()"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-blue-600 text-xs font-semibold">
              {{ showPassword ? 'Hide' : 'Show' }}
            </button>
          </div>
        </div>

        <button type="submit" [disabled]="loginForm.invalid || loading"
          class="w-full py-2.5 rounded text-white font-semibold text-sm bg-blue-600 hover:bg-blue-700 cursor-pointer disabled:opacity-50 mt-2">
          {{ loading ? 'Signing In...' : 'Sign In' }}
        </button>
      </form>

    </div>
  </div>

  <p class="text-center text-slate-400 text-xs py-4">© 2026 Uma Clinic. All Rights Reserved.</p>
</div>
